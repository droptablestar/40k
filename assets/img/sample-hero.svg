<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="Placeholder art standing in for a photo of a painted model">
  <!-- Placeholder art. Drawn, not photographed — swap this file for a real
       photo of a model you painted. Nothing here is GW material. -->
  <defs>
    <radialGradient id="hr-bg" cx="30%" cy="26%" r="86%">
      <stop offset="0%" stop-color="#7A6234"/>
      <stop offset="42%" stop-color="#3A2E1B"/>
      <stop offset="100%" stop-color="#100D09"/>
    </radialGradient>
    <linearGradient id="hr-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2B2317"/>
      <stop offset="100%" stop-color="#0A0805"/>
    </linearGradient>
    <filter id="hr-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="hr-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="hr-far" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="hr-grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.14"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#hr-bg)"/>
  <path d="M0 500 H800 V800 H0 Z" fill="url(#hr-floor)"/>

  <g filter="url(#hr-blur)" opacity=".5">
    <circle cx="150" cy="170" r="60" fill="#D8B564"/>
    <circle cx="676" cy="230" r="42" fill="#8A6E38"/>
    <circle cx="590" cy="128" r="26" fill="#E5C98A"/>
  </g>

  <!-- everything below is shifted so the subject sits dead centre of the
       square crop the circular frame takes -->
  <g transform="translate(-175,40) scale(1.35)">
  <!-- a second model, well out of focus behind -->
  <g filter="url(#hr-far)" opacity=".55">
    <ellipse cx="596" cy="368" rx="72" ry="13" fill="#000" opacity=".6"/>
    <path d="M576 368 C571 348 575 330 584 320 L581 300 C578 286 585 276 597 276 C609 276 616 286 613 300 L610 318 C621 328 625 348 620 368 Z" fill="#0F0C08"/>
    <path d="M613 306 C626 300 635 289 639 277 L648 281 C644 296 634 307 620 314 Z" fill="#0F0C08"/>
    <ellipse cx="596" cy="368" rx="40" ry="7" fill="#1A1509"/>
  </g>

  <!-- contact shadow, foreground model -->
  <ellipse cx="366" cy="404" rx="130" ry="20" fill="#000" opacity=".6" filter="url(#hr-soft)"/>

  <g fill="#0C0A07">
    <!-- legs, braced -->
    <path d="M320 404 C314 376 320 350 334 334 L358 340 C348 358 345 382 350 404 Z"/>
    <path d="M374 404 C370 380 376 358 390 344 L410 354 C400 368 396 386 399 404 Z"/>
    <!-- waist, chest -->
    <path d="M338 340 L404 348 C412 330 414 310 411 292 L342 284 C336 300 334 324 338 340 Z"/>
    <path d="M342 284 L411 292 C416 264 410 242 398 232 L354 227 C343 240 338 262 342 284 Z"/>
    <!-- shoulder plates -->
    <path d="M318 258 C314 234 326 218 346 219 L356 251 C346 264 330 267 318 258 Z"/>
    <path d="M432 268 C438 244 428 226 408 224 L397 255 C406 270 420 274 432 268 Z"/>
    <!-- helm -->
    <path d="M358 226 C353 206 362 192 378 191 C394 190 405 202 403 220 L401 227 Z"/>
    <path d="M355 213 L340 218 L342 227 L358 227 Z"/>
    <!-- arm and weapon held low -->
    <path d="M424 262 C441 256 454 244 460 228 L474 234 C468 258 452 276 430 285 Z"/>
    <path d="M462 232 L516 138 L525 143 L470 238 Z"/>
    <path d="M520 132 C534 122 552 122 564 132 C550 136 538 146 532 158 C531 148 527 138 520 132 Z"/>
  </g>

  <!-- rim light: one lamp, camera left -->
  <g fill="none" stroke="#F1E4C2" stroke-opacity=".8" stroke-width="3.4" stroke-linecap="round">
    <path d="M318 258 C314 234 326 218 346 219"/>
    <path d="M358 226 C353 206 362 192 378 191"/>
    <path d="M342 284 C338 262 343 240 354 227"/>
    <path d="M320 400 C314 375 321 351 334 335"/>
  </g>
  <g fill="none" stroke="#D8B564" stroke-opacity=".55" stroke-width="2.2" stroke-linecap="round">
    <path d="M462 234 L515 141"/>
    <path d="M339 341 L404 349"/>
    <path d="M520 132 C534 122 552 122 564 132"/>
  </g>

  <!-- base -->
  <ellipse cx="366" cy="404" rx="78" ry="13" fill="#1A1509"/>
  <path d="M288 404 A78 13 0 0 0 444 404" fill="none" stroke="#6A5730" stroke-width="3" opacity=".85"/>

  </g>

  <rect width="800" height="800" filter="url(#hr-grain)" opacity=".5"/>
</svg>
