<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Placeholder art standing in for a photo of several painted models">
  <!-- Placeholder art. Drawn, not photographed — swap this file for a real
       photo of models you painted. Nothing here is GW material. -->
  <defs>
    <radialGradient id="sh-bg" cx="50%" cy="26%" r="82%">
      <stop offset="0%" stop-color="#6A5A38"/>
      <stop offset="45%" stop-color="#332B1D"/>
      <stop offset="100%" stop-color="#12100C"/>
    </radialGradient>
    <linearGradient id="sh-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A2418"/>
      <stop offset="100%" stop-color="#0A0906"/>
    </linearGradient>
    <filter id="sh-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
    <filter id="sh-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="sh-far" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="sh-grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.16"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#sh-bg)"/>
  <path d="M0 214 H400 V300 H0 Z" fill="url(#sh-floor)"/>

  <g filter="url(#sh-blur)" opacity=".45">
    <circle cx="330" cy="64" r="28" fill="#D8B564"/>
    <circle cx="58" cy="88" r="22" fill="#8E7A46"/>
  </g>

  <!-- back rank, out of focus: depth is what makes a shelf shot read -->
  <g filter="url(#sh-far)" opacity=".8">
    <ellipse cx="96" cy="226" rx="46" ry="9" fill="#000" opacity=".5"/>
    <g fill="#100E0A">
      <path d="M84 226 C81 213 84 202 90 195 L88 182 C86 172 91 165 99 165 C107 165 112 172 110 182 L108 194 C116 202 119 213 116 226 Z"/>
      <path d="M110 200 C118 196 124 189 127 181 L133 184 C130 194 123 202 114 207 Z"/>
    </g>
    <ellipse cx="96" cy="226" rx="26" ry="5" fill="#191509"/>

    <ellipse cx="318" cy="228" rx="46" ry="9" fill="#000" opacity=".5"/>
    <g fill="#100E0A">
      <path d="M306 228 C303 214 306 203 312 196 L310 183 C308 173 313 166 321 166 C329 166 334 173 332 183 L330 195 C338 203 341 214 338 228 Z"/>
      <path d="M310 201 C302 197 296 190 293 182 L287 185 C290 195 297 203 306 208 Z"/>
    </g>
    <ellipse cx="318" cy="228" rx="26" ry="5" fill="#191509"/>
  </g>

  <!-- front model, in focus -->
  <ellipse cx="200" cy="258" rx="80" ry="13" fill="#000" opacity=".55" filter="url(#sh-soft)"/>
  <g fill="#0D0B08">
    <!-- legs -->
    <path d="M186 256 C182 242 185 230 192 222 L202 224 C198 233 197 245 200 256 Z"/>
    <path d="M210 256 C208 244 211 232 219 224 L228 229 C223 237 221 246 223 256 Z"/>
    <!-- body and head -->
    <path d="M192 224 L228 227 C232 214 231 200 224 192 L198 190 C191 199 189 213 192 224 Z"/>
    <path d="M201 190 C198 179 203 171 212 171 C221 171 227 178 226 189 Z"/>
    <!-- arms out, weapon held across -->
    <path d="M224 196 C236 191 246 181 250 169 L258 173 C254 188 244 199 230 206 Z"/>
    <path d="M198 194 C186 191 176 182 172 171 L164 176 C168 191 179 202 193 207 Z"/>
  </g>
  <g fill="none" stroke="#E9DCB8" stroke-opacity=".75" stroke-width="2.2" stroke-linecap="round">
    <path d="M201 190 C198 179 203 171 212 171"/>
    <path d="M198 191 C191 200 189 213 192 224"/>
  </g>
  <g fill="none" stroke="#D8B564" stroke-opacity=".6" stroke-width="1.5" stroke-linecap="round">
    <path d="M225 197 C237 192 246 182 250 170"/>
  </g>
  <ellipse cx="204" cy="258" rx="46" ry="8" fill="#1B170E"/>
  <path d="M158 258 A46 8 0 0 0 250 258" fill="none" stroke="#5A4A2E" stroke-width="2.5" opacity=".8"/>

  <rect width="400" height="300" filter="url(#sh-grain)" opacity=".5"/>
</svg>
