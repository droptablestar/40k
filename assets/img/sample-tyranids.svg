<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Placeholder art standing in for a photo of a painted model">
  <!-- Placeholder art. Drawn, not photographed — swap this file for a real
       photo of a model you painted. Nothing here is GW material. -->
  <defs>
    <radialGradient id="ty-bg" cx="62%" cy="34%" r="78%">
      <stop offset="0%" stop-color="#6B4E9B"/>
      <stop offset="45%" stop-color="#33254A"/>
      <stop offset="100%" stop-color="#100E14"/>
    </radialGradient>
    <linearGradient id="ty-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#241B33"/>
      <stop offset="100%" stop-color="#0B0910"/>
    </linearGradient>
    <filter id="ty-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="ty-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="ty-grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.16"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#ty-bg)"/>
  <path d="M0 214 H400 V300 H0 Z" fill="url(#ty-floor)"/>

  <!-- out-of-focus highlights: the shallow depth of field a phone macro gives you -->
  <g filter="url(#ty-blur)" opacity=".55">
    <circle cx="316" cy="70" r="30" fill="#B99FE0"/>
    <circle cx="358" cy="132" r="18" fill="#8E6FD0"/>
    <circle cx="66" cy="58" r="22" fill="#5B4488"/>
  </g>

  <!-- contact shadow -->
  <ellipse cx="196" cy="252" rx="88" ry="14" fill="#000" opacity=".55" filter="url(#ty-soft)"/>

  <g>
    <!-- silhouette: hunched bio-horror, scything limbs, tail -->
    <g fill="#0C0A10">
      <!-- legs, kept apart so light shows between them -->
      <path d="M168 252 C162 240 165 227 175 219 C181 214 183 207 181 201 L192 199 C194 209 191 218 185 224 C177 232 175 242 179 252 Z"/>
      <path d="M200 252 C194 241 197 228 207 221 C213 217 215 210 213 204 L224 202 C226 212 223 220 217 226 C209 233 207 243 211 252 Z"/>
      <!-- hunched torso -->
      <path d="M180 206 C176 192 184 178 199 171 C210 166 221 168 229 175 C236 181 236 191 229 196 C217 204 198 210 184 212 Z"/>
      <!-- long low-slung head -->
      <path d="M227 178 C236 168 249 158 264 153 C270 151 273 156 269 159 C257 167 245 176 237 185 Z"/>
      <!-- scything limbs -->
      <path d="M228 172 C244 147 266 127 291 114 L295 121 C273 135 253 155 239 179 Z"/>
      <path d="M222 180 C236 161 253 146 272 137 L275 143 C258 153 242 168 231 186 Z"/>
      <!-- tail -->
      <path d="M186 234 C204 244 232 247 256 238 C272 232 285 221 293 209 L299 213 C290 230 274 244 254 251 C230 259 202 256 184 245 Z"/>
    </g>
    <!-- rim light down the lit edge, the way a single desk lamp reads -->
    <g fill="none" stroke="#C6ADE8" stroke-opacity=".8" stroke-width="2.2" stroke-linecap="round">
      <path d="M180 205 C176 192 184 178 199 171"/>
      <path d="M228 172 C244 147 266 127 291 114"/>
      <path d="M227 178 C236 168 249 158 264 153"/>
    </g>
    <g fill="none" stroke="#E58466" stroke-opacity=".45" stroke-width="1.5" stroke-linecap="round">
      <path d="M186 234 C204 244 232 247 256 238"/>
      <path d="M168 250 C163 239 166 227 175 219"/>
    </g>
  </g>

  <!-- base rim -->
  <ellipse cx="200" cy="252" rx="52" ry="9" fill="#1A1520"/>
  <path d="M148 252 A52 9 0 0 0 252 252" fill="none" stroke="#5A4A2E" stroke-width="2.5" opacity=".8"/>

  <rect width="400" height="300" filter="url(#ty-grain)" opacity=".5"/>
  <rect width="400" height="300" fill="none"/>
</svg>
