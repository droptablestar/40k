<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Placeholder art standing in for a photo of a painted model">
  <!-- Placeholder art. Drawn, not photographed — swap this file for a real
       photo of a model you painted. Nothing here is GW material. -->
  <defs>
    <radialGradient id="we-bg" cx="38%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#8A3A2A"/>
      <stop offset="45%" stop-color="#41201C"/>
      <stop offset="100%" stop-color="#140C0B"/>
    </radialGradient>
    <linearGradient id="we-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2C1A16"/>
      <stop offset="100%" stop-color="#0C0706"/>
    </linearGradient>
    <filter id="we-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="we-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="we-grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.16"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#we-bg)"/>
  <path d="M0 216 H400 V300 H0 Z" fill="url(#we-floor)"/>

  <g filter="url(#we-blur)" opacity=".5">
    <circle cx="74" cy="66" r="30" fill="#E58466"/>
    <circle cx="30" cy="140" r="18" fill="#C0563C"/>
    <circle cx="336" cy="80" r="24" fill="#6E3226"/>
  </g>

  <ellipse cx="204" cy="254" rx="86" ry="14" fill="#000" opacity=".55" filter="url(#we-soft)"/>

  <g>
    <!-- silhouette: bulk-armoured figure, axe raised -->
    <g fill="#0E0908">
      <!-- legs, braced apart -->
      <path d="M176 254 C172 238 176 224 184 214 L198 216 C193 228 192 241 196 254 Z"/>
      <path d="M214 254 C212 240 216 226 225 217 L237 223 C231 232 229 243 232 254 Z"/>
      <!-- waist and chest, narrower at the belt -->
      <path d="M186 216 L228 218 C232 208 234 198 233 188 L188 186 C186 196 185 207 186 216 Z"/>
      <path d="M188 186 L233 188 C236 174 233 162 226 156 L196 155 C189 162 186 174 188 186 Z"/>
      <!-- shoulder plates -->
      <path d="M172 172 C170 158 178 148 190 148 L196 168 C190 176 180 178 172 172 Z"/>
      <path d="M248 176 C252 161 245 150 233 149 L226 168 C232 177 241 180 248 176 Z"/>
      <!-- helm with a snout -->
      <path d="M199 154 C196 142 201 133 211 132 C221 131 228 138 227 149 L226 154 Z"/>
      <path d="M197 146 L189 149 L190 154 L199 154 Z"/>
      <!-- arm holding the haft -->
      <path d="M244 172 C254 168 262 160 266 150 L275 154 C271 168 262 179 249 185 Z"/>
      <path d="M268 150 L286 78 L292 80 L275 153 Z"/>
      <!-- axe head, two-lobed -->
      <path d="M289 74 C303 70 317 78 322 91 C310 88 297 91 289 99 C292 91 292 81 289 74 Z"/>
      <path d="M287 74 C273 71 260 80 256 93 C268 89 280 92 288 99 C285 91 285 81 287 74 Z"/>
    </g>
    <!-- rim light: single lamp from the left -->
    <g fill="none" stroke="#F0A78C" stroke-opacity=".8" stroke-width="2.2" stroke-linecap="round">
      <path d="M172 172 C170 158 178 148 190 148"/>
      <path d="M199 154 C196 142 201 133 211 132"/>
      <path d="M188 186 C186 174 189 163 196 156"/>
      <path d="M287 74 C273 71 260 80 256 93"/>
    </g>
    <g fill="none" stroke="#D8B564" stroke-opacity=".55" stroke-width="1.5" stroke-linecap="round">
      <path d="M268 151 L285 80"/>
      <path d="M187 217 L228 219"/>
    </g>
  </g>

  <ellipse cx="206" cy="254" rx="54" ry="9" fill="#1C1210"/>
  <path d="M152 254 A54 9 0 0 0 260 254" fill="none" stroke="#5A4A2E" stroke-width="2.5" opacity=".8"/>

  <rect width="400" height="300" filter="url(#we-grain)" opacity=".5"/>
</svg>
